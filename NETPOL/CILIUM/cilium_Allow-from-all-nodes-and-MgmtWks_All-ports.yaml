# ──────────────────────────────────────────────────────────────
# Proposed by Claude AI
# CiliumClusterwideNetworkPolicy — Master nodes ingress
# Uses fromEntities to match cluster nodes by Cilium identity,
# plus a CIDR exception for the management workstation (which
# has no Cilium identity as it is external).
# ──────────────────────────────────────────────────────────────
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-ingress-all-nodes
spec:
  nodeSelector:
    matchLabels:
      #beta.kubernetes.io/os: "linux"
      #node-role.kubernetes.io/control-plane: ""

  ingress:
    # ── Rule 1: allow from all nodes in the cluster ───────────
    # The "host" entity matches the host network namespace of
    # every node (kubelet, kube-proxy, CNI, etc.).
    # "remote-node" covers all other nodes in the cluster
    # that are not the local node itself.
    - fromEntities:
        #- host           # local node's host network namespace
        #- remote-node    # every other cluster node
        - cluster         # all cluster and host endpoints

    # ── Rule 2: allow from the management workstation ─────────
    # External hosts have no Cilium identity, so fromEntities
    # cannot match them — fromCIDR is still required here.
    - fromCIDR:
        - "10.13.3.2/32"

