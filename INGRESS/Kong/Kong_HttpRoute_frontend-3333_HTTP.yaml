apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-http-frontend-3333 
  annotations:
    konghq.com/strip-path: 'true'
    # Next line active IP restriction plugin named rule
    #konghq.com/plugins: ipr-test-network-only 
spec:
  parentRefs:
  - name: gateway-kong-http
  hostnames:
  - "haprx1.lab.byte13.org"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /frontend-3333
    backendRefs:
    - name: service-alpine-k8s-tools-3333 
      kind: Service
      port: 3333
