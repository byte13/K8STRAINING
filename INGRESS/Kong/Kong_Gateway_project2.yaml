apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-project2
  namespace: project2-gw-ns
  annotations:
    # Next line active IP restriction plugin named rule
    #konghq.com/plugins: ipr-clients-3333 
spec:
  gatewayClassName: gwclass-kong
  listeners:
  - name: kong-http 
    port: 80 
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            projectname: project2ns
